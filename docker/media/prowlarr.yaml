version: "3.8"

services:
  prowlarr:
    image: linuxserver/prowlarr:2.3.5
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /mnt/docker/prowlarr:/config
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 256M
        limits:
          cpus: "0.25"
          memory: 512M
