version: "3.8"

services:
  sonarr:
    image: linuxserver/sonarr:4.0.17
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /mnt/docker/sonarr:/config
      - /mnt/downloads:/downloads
      - /mnt/tv:/tv
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 256M
        limits:
          cpus: "2"
          memory: 4G
